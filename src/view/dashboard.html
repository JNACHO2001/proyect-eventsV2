<body>
  <div class="dashboard">
    <!-- Sidebar izquierdo - Información del usuario -->
    <aside class="sidebar">
      <div class="user-info">
       
      </div>

      <div class="user-stats">
        <div class="stat-item">
          <span class="stat-label">Eventos creados</span>
          <span class="stat-value">12</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">Participantes totales</span>
          <span class="stat-value">248</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">Eventos activos</span>
          <span class="stat-value">5</span>
        </div>
      </div>

      <!-- Botón de salir centrado al final -->
      <button class="logout-btn">Salir</button>
    </aside>

    <!-- Contenido principal -->
    <main class="main-content">
      <header class="header">
        <h1 class="page-title">Mis Eventos</h1>
        <button class="create-btn">Crear Evento</button>
      </header>

      <!-- Lista de eventos -->
      <div class="events-grid">
        <div class="event-card">
          <h3 class="event-title">Conferencia de Tecnología 2024</h3>
          <p class="event-date">15 de Marzo, 2024 - 09:00 AM</p>
          <p class="event-description">
            Una conferencia sobre las últimas tendencias en tecnología,
            inteligencia artificial y desarrollo web.
          </p>
          <p class="event-capacity">Capacidad: 150 personas</p>
          <div class="event-actions">
            <button class="edit-btn">Editar</button>
            <button class="delete-btn">Eliminar</button>
          </div>
        </div>

        
        
      </div>
    </main>
  </div>
</body>
